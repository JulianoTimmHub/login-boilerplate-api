version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth-login
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth-login-api:
    build: '.'
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/auth-login"
    depends_on:
      - postgres
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node dist/main.js
      "
    env_file:
      - ./.env

volumes:
  pgdata:
